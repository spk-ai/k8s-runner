{{- if .Values.workloadIngressNetworkPolicy.enabled }}
{{- $policy := .Values.workloadIngressNetworkPolicy -}}
{{- $selector := dict -}}
{{- range $key, $value := $policy.podSelectorLabels -}}
{{- if ne $value nil -}}
{{- if not (kindIs "string" $value) -}}
{{- fail "workloadIngressNetworkPolicy.podSelectorLabels values must be strings" -}}
{{- end -}}
{{- $_ := set $selector $key $value -}}
{{- end -}}
{{- end -}}
{{- if not $selector -}}
{{- fail "workloadIngressNetworkPolicy.podSelectorLabels must not be empty" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ required "workloadIngressNetworkPolicy.name is required" $policy.name | quote }}
  namespace: {{ default .Release.Namespace .Values.workloadNamespace | quote }}
  labels:
    {{- include "service-base.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
