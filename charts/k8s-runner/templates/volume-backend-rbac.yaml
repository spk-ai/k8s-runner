{{- if .Values.rbac.create }}
{{- $name := printf "%s-%s-volume-backend" .Release.Namespace (include "service-base.fullname" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ required "workloadNamespace is required for volume backend identity" .Values.workloadNamespace | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "service-base.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
