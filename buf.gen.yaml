version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/k8s-runner/internal/.gen

inputs:
  - git_repo: https://github.com/spk-ai/api.git
    ref: b70aa1502b0b95ee3dd9260fef8007b635fdba97
    subdir: proto
    paths:
      - agynio/api/runner/v1
      - agynio/api/runners/v1
      - agynio/api/gateway/v1

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: internal/.gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: internal/.gen
    opt:
      - paths=source_relative
