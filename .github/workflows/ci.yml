name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm chart
        run: scripts/verify-workload-egress-networkpolicy.sh

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      # Prepared workloads and anchored volumes require this reviewed API tree.
      - name: Checkout matching API contract
        uses: actions/checkout@v4
        with:
          repository: spk-ai/api
          ref: b70aa1502b0b95ee3dd9260fef8007b635fdba97
          path: .ci-api
          persist-credentials: false

      - name: Generate protobuf bindings
        run: buf generate .ci-api --include-imports

      - name: Run tests
        run: go test ./...

      # The Pod shapes the runner builds, evaluated by the pinned Kubernetes
      # v1.35 restricted Pod Security evaluator in its own module.
      - name: Evaluate workload Pod Security fixtures (restricted v1.35)
        working-directory: hack/podcheck
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Build production image with pinned API
        run: docker build --progress=plain -t native-service:ci .
