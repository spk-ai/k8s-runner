name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned E2E tooling
        uses: actions/checkout@v4
        with:
          repository: agynio/e2e
          ref: 435b549a937129b6858e7314648eb690894209fe
          path: .e2e-tooling
          persist-credentials: false

      - name: Prepare disposable VM image repair and diagnostics
        run: python3 .github/e2e/prepare.py .e2e-tooling

      - name: Provision cluster
        uses: ./.e2e-tooling/.github/actions/provision-vm
        with:
          agyn-cli-version: v0.19.0

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@435b549a937129b6858e7314648eb690894209fe

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      # The VM's platform release predates the chart's volume-backend grant and
      # the source deployment is patched in place, so apply the chart's own
      # render. The script proves the only added permission is get on the
      # single workload Namespace; this does not change any production RBAC.
      - name: Grant the source chart's volume-backend namespace read
        run: python3 .github/e2e/volume-backend-rbac.py

      - name: Deploy k8s-runner from source
        id: deploy
        run: devspace run deploy

      - name: Run E2E tests
        uses: ./.e2e-tooling/.github/actions/run-tests
        with:
          e2e-ref: 435b549a937129b6858e7314648eb690894209fe
          service: k8s_runner

      - name: Verify runner-owned resources were cleaned up
        if: always() && steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          selector=app.kubernetes.io/managed-by=k8s-runner
          for _ in $(seq 1 24); do
            left="$(kubectl get pods,pvc,secrets,configmaps -n agyn-workloads -l "${selector}" -o name)"
            orphans="$(kubectl get pv -o json | python3 -c 'import json,sys; print("\n".join(p["metadata"]["name"] for p in json.load(sys.stdin)["items"] if (p["spec"].get("claimRef") or {}).get("namespace") == "agyn-workloads" and p["status"].get("phase") != "Bound"))')"
            if [ -z "${left}" ]; then
              echo "No runner-owned workload resources remain."
              if [ -n "${orphans}" ]; then
                echo "::warning::unbound workload volumes remain (check reclaim policy): ${orphans//$'\n'/ }"
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::runner-owned resources remain after the suite"
          printf '%s\n' "${left}"
          kubectl get pods,pvc -n agyn-workloads -o wide || true
          kubectl get pv -o wide || true
          exit 1

      # The disposable VM is Helm-owned; there is no ArgoCD sync to restore.
      - name: Collect source deployment diagnostics
        if: failure()
        run: |
          kubectl get pods -n agyn-platform -l app.kubernetes.io/name=k8s-runner -o wide || true
          kubectl describe pods -n agyn-platform -l app.kubernetes.io/name=k8s-runner || true
          kubectl logs -n agyn-platform -l app.kubernetes.io/name=k8s-runner --all-containers --tail=100 || true

      - name: Stop disposable platform VM
        if: always()
        timeout-minutes: 3
        run: |
          if command -v agyn >/dev/null 2>&1; then
            agyn local stop
          fi
